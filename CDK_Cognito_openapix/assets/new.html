<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS簡易Webアプリケーション開発</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="style.css">
  </head>
<body>
  <header class="p-3 mb-4 bg-warning">
    <h1>AWS簡易Webアプリケーション開発</h1>
    <a href="index.html" class="text-dark">トップページ</a>
  </header>

  <main class="container">
    <h2 class="mb-4">新規登録ページ</h2>

    <form id="user-form">
      <div class="mb-3">
        <label for="name" class="form-label">氏名</label>
        <input type="text" name="name" id="name" class="form-control" placeholder="氏名" required>
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">メールアドレス</label>
        <input type="email" name="email" id="email" class="form-control" placeholder="メールアドレス" required>
      </div>
      <div class="mb-3">
        <label for="phone" class="form-label">電話番号(任意)</label>
        <input type="tel" name="phone" id="phone" class="form-control" placeholder="例）0312345678">
      </div>
      <div class="mb-3">
        <label for="birth" class="form-label">生年月日</label>
        <input type="date" name="birth" id="birth" class="form-control" placeholder="生年月日" required>
      </div>
      <button type="submit" class="btn btn-warning" id="submit-button">登録</button>
    </form>
  </main>


  <script src="config.js"></script>
  <script src="new.js"></script>

</body>
</html>
